[theme]
base = "light"
primaryColor = "#FF9900"              # Amazon-style orange
backgroundColor = "#EAEDED"           # light gray page
secondaryBackgroundColor = "#FFFFFF"  # white cards / inputs
textColor = "#0F1111"
font = "sans serif"

[server]
headless = true
maxUploadSize = 25

[browser]
gatherUsageStats = false
