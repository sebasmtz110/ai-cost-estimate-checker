[theme]
base = "dark"
primaryColor = "#FF9F1C"              # amber/orange terminal accent
backgroundColor = "#07090C"           # near-black
secondaryBackgroundColor = "#11161D"  # panel
textColor = "#E6E6E6"
font = "monospace"

[server]
headless = true
maxUploadSize = 25

[browser]
gatherUsageStats = false
