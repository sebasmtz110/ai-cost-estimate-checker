[theme]
base = "light"
primaryColor = "#4F46E5"              # calm indigo accent
backgroundColor = "#F6F7FB"           # soft off-white slate
secondaryBackgroundColor = "#FFFFFF"  # white cards / inputs
textColor = "#1E293B"
font = "sans serif"

[server]
headless = true
maxUploadSize = 25

[browser]
gatherUsageStats = false
